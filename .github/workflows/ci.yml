name: ci

on:
  push:
  pull_request:

env:
  CLASHON_TEST_SUB_URL: ${{ secrets.CLASHON_TEST_SUB_URL }}

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/ ./cli/cmd/clashon ./tui/cmd/clashon-tui
