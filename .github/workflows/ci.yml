name: ci

on:
  push:
  pull_request:

env:
  CLASHON_TEST_SUB_URL: ${{ secrets.CLASHON_TEST_SUB_URL }}

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - run: go build -tags with_gvisor -o bin/ ./cli/cmd/clashon ./tui/cmd/clashon-tui

  e2e-tun:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make build
      - name: TUN end-to-end
        run: |
          if [ -z "$CLASHON_TEST_SUB_URL" ]; then echo "no test subscription, skipping"; exit 0; fi
          scripts/e2e-tun.sh

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release

  flutter-build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ${{ matrix.os == 'windows-latest' && 'windows' || 'macos' }} --release

  windows-e2e:
    runs-on: windows-latest
    if: github.event_name == 'push'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Check test subscription
        id: sub
        run: echo "ok=$([ -n "$CLASHON_TEST_SUB_URL" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - run: scripts/build-cli.sh windows amd64 "$RUNNER_TEMP/clashon.exe" ci
      - name: GUI state layer against the real CLI
        if: steps.sub.outputs.ok == '1'
        working-directory: app
        run: |
          export CLASHON_BIN="$RUNNER_TEMP/clashon.exe" CLASHON_HOME="$RUNNER_TEMP/home-it"
          flutter test integration_test -d windows
      - run: flutter build windows --release
        working-directory: app
      - run: scripts/package-windows.sh ci
      - name: Installer, CLI and clash:// links
        if: steps.sub.outputs.ok == '1'
        run: scripts/e2e-windows.sh
      - name: Screenshot on failure
        if: failure()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($img).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $img.Save("$env:RUNNER_TEMP\\screen.png")
          Copy-Item "$env:APPDATA\\clashon\\core.log" $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          Copy-Item "$env:TEMP\\clashon-gui.log" $env:RUNNER_TEMP -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-e2e-debug
          path: |
            ${{ runner.temp }}/screen.png
            ${{ runner.temp }}/core.log
            ${{ runner.temp }}/clashon-gui.log
